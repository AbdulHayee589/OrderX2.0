# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7e3384419f778351adcc91535750b652"
name = "OrderX"
application_url = "https://app.orderxapp.com/app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://app.orderxapp.com/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://app.orderxapp.com/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "fulfillments/create" ]
  uri = "https://app.orderxapp.com/webhooks/fulfillments/create"

  [[webhooks.subscriptions]]
  topics = [ "fulfillments/update" ]
  uri = "https://app.orderxapp.com/webhooks/fulfillments/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://app.orderxapp.com/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "https://app.orderxapp.com/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://app.orderxapp.com/webhooks/compliance"

  

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_fulfillments,read_customers,read_products,write_order_edits,read_order_edits,read_orders,write_orders"

[auth]
redirect_urls = ["https://app.orderxapp.com/app-auth/callback"]
